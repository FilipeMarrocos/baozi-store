spring.application.name=baozi-store
server.port=8080

# ===== Banco H2 (arquivo local, os dados não somem ao reiniciar) =====
spring.datasource.url=jdbc:h2:file:./data/baozidb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ===== Para usar MySQL, comente o bloco H2 acima e use este =====
